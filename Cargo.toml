[package]
name = "spotprice-exporter"
version = "0.1.2" # x-release-please-version
edition = "2024"
rust-version = "1.85.0"
authors = ["spotprice-exporter contributors"]
license = "MIT"
description = "Exports day-ahead electricity spot prices per bidding zone as OpenTelemetry metrics (OTLP push)"

[dependencies]
axum = "0.8"
clap = { version = "4.6.8", features = ["derive", "env"] }
jiff = { version = "1.0.1", default-features = false, features = ["std", "tzdb-bundle-always"] }
opentelemetry = { version = "0.33.1", features = ["metrics"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["metrics", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.33.1", features = ["metrics", "rt-tokio"] }
quick-xml = "0.42.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
secrecy = "0.10"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
