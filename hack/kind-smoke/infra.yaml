# Mock ENTSO-E API and an OpenTelemetry Collector with a debug exporter, for the kind smoke test.
# The mock script is mounted from a ConfigMap generated by hack/kind-smoke.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otelcol-config
  namespace: observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: {app: otel-collector}
  template:
    metadata:
      labels: {app: otel-collector}
    spec:
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.165.0
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
      volumes:
        - name: config
          configMap:
            name: otelcol-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector: {app: otel-collector}
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-entsoe
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: {app: mock-entsoe}
  template:
    metadata:
      labels: {app: mock-entsoe}
    spec:
      containers:
        - name: mock
          image: python:3.12-alpine
          command: ["python3", "/app/mock_entsoe.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: mock-entsoe-script
---
apiVersion: v1
kind: Service
metadata:
  name: mock-entsoe
  namespace: observability
spec:
  selector: {app: mock-entsoe}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
