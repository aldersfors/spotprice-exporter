name: Sync chart in release PR

# release-please does not update the Helm chart in the release PR, so this workflow does it.
# After each Release Please run, it copies the version from the release manifest into the chart
# version, appVersion and image tag on the release PR branch, so the chart and image ship together.

on:
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_BRANCH: release-please--branches--main--components--spotprice-exporter

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for an open release PR branch
        id: branch
        run: |
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync chart version and image tag
        if: ${{ steps.branch.outputs.exists == 'true' }}
        run: |
          git fetch origin "$RELEASE_BRANCH"
          git switch -C "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"
          version=$(python3 -c 'import json; print(json.load(open(".release-please-manifest.json"))["."])')
          sed -i -E "s/^version: .*/version: ${version}/" charts/spotprice-exporter/Chart.yaml
          sed -i -E "s/^appVersion: .*/appVersion: \"${version}\"/" charts/spotprice-exporter/Chart.yaml
          sed -i -E "s/^  tag: .*/  tag: \"${version}\"/" charts/spotprice-exporter/values.yaml
          if git diff --quiet; then
            echo "Chart already matches ${version}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): sync chart and image tag to ${version}"
          git push origin "HEAD:$RELEASE_BRANCH"
